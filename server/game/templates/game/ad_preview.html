{% load static %}
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마을 광고 확인</title>
<style>body{background:#f7f7ee;font:16px/1.7 'Malgun Gothic',sans-serif;color:#203e34;max-width:660px;margin:50px auto;padding:24px}button,select{font:inherit;padding:10px;border:1px solid #c5d5bd;border-radius:9px}button{background:#23694e;color:white}article{margin-top:28px;background:#e3edce;padding:30px;border-radius:20px;text-align:center}img{image-rendering:pixelated;width:112px;height:112px}small{display:block;overflow-wrap:anywhere;color:#66775c}</style>
<script src="{% static 'game/ad_preview.js' %}" defer></script></head><body><h1>마을에서 받은 광고</h1><p>게임 계정: {{ user.username }}</p><select id="slot"><option value="village-board">마을 게시판</option><option value="lobby-banner">로비 배너</option></select> <button id="request-ad">광고 새로 받기</button><p id="message" role="status">광고를 요청하면 이미지와 선택 당시 금액을 확인할 수 있습니다.</p><article id="ad" hidden><img id="creative" alt="선택된 광고 이미지"><h2 id="title"></h2><p id="body"></p><small id="receipt"></small></article></body></html>
